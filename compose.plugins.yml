# Opt-in production override for operator-signed trusted external plugins.
# Use with: docker compose -f compose.prod.yml -f compose.plugins.yml ...
# Never include this file unless VIBRESS_PLUGIN_RELEASE_DIR is provisioned.
# The host directory contains approved .mjs/HTML assets, trusted-plugins.json,
# detached operator.sig and operator-public.pem. NEVER mount the private key.
services:
  api:
    environment:
      VIBRESS_TRUSTED_PLUGIN_LOCKFILE: /run/vibress-plugins/trusted-plugins.json
      VIBRESS_TRUSTED_PLUGIN_PUBLIC_KEY_FILE: /run/vibress-plugins/operator-public.pem
      VIBRESS_TRUSTED_PLUGIN_SIGNATURE_FILE: /run/vibress-plugins/operator.sig
      VIBRESS_TRUSTED_PLUGIN_REQUIRE_SIGNATURE: "1"
    volumes:
      - type: bind
        source: ${VIBRESS_PLUGIN_RELEASE_DIR:?set an absolute operator-controlled release directory}
        target: /run/vibress-plugins
        read_only: true

  worker:
    environment:
      VIBRESS_TRUSTED_PLUGIN_LOCKFILE: /run/vibress-plugins/trusted-plugins.json
      VIBRESS_TRUSTED_PLUGIN_PUBLIC_KEY_FILE: /run/vibress-plugins/operator-public.pem
      VIBRESS_TRUSTED_PLUGIN_SIGNATURE_FILE: /run/vibress-plugins/operator.sig
      VIBRESS_TRUSTED_PLUGIN_REQUIRE_SIGNATURE: "1"
    volumes:
      - type: bind
        source: ${VIBRESS_PLUGIN_RELEASE_DIR:?set an absolute operator-controlled release directory}
        target: /run/vibress-plugins
        read_only: true
