events {
    worker_connections 1024;
}

http {
    server {
        listen 7777;

        # Healthcheck
        location = /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }

        # Web App (default)
        location / {
            proxy_pass http://host.docker.internal:7778;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support (for Vite/Next dev servers)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Admin App
        location /admin/ {
            proxy_pass http://host.docker.internal:7779;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Portal App
        location /portal/ {
            proxy_pass http://host.docker.internal:7781;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # API
        location /api/ {
            # Preserve the /api prefix: the API registers routes under /api/...
            # (e.g. /api/admin/v1/auth/login, /api/health). Health probes can use
            # /api/health (API also exposes /health/live for direct probing).
            proxy_pass http://host.docker.internal:7780;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Media serving (API)
        location /content/media/ {
            proxy_pass http://host.docker.internal:7780;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Worker Health (Internal debugging)
        location /worker-health/ {
            proxy_pass http://host.docker.internal:7782/;
            proxy_set_header Host $host;
        }
    }
}
