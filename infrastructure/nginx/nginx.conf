events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS (present on every Compose network). Resolving
    # host.docker.internal through it with `ipv6=off` guarantees the IPv4
    # host-gateway address (192.168.65.254 on Docker Desktop, 172.17.0.1 on
    # Linux Docker Engine). Plain startup-time hostname resolution can pick
    # Docker Desktop's unreachable IPv6 alias (fdc4::254) instead, so the
    # host apps are always reached via explicit variables resolved per
    # request below.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 7777;

        # Healthcheck
        location = /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }

        # Web App (default)
        location / {
            set $web_upstream host.docker.internal:7778;
            proxy_pass http://$web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support (for Vite/Next dev servers)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Admin App
        location /admin/ {
            set $admin_upstream host.docker.internal:7779;
            proxy_pass http://$admin_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Portal App
        location /portal/ {
            set $portal_upstream host.docker.internal:7781;
            proxy_pass http://$portal_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # API
        location /api/ {
            # Preserve the /api prefix: the API registers routes under /api/...
            # (e.g. /api/admin/v1/auth/login, /api/health). Health probes can use
            # /api/health (API also exposes /health/live for direct probing).
            set $api_upstream host.docker.internal:7780;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Media serving (API)
        location /content/media/ {
            set $media_upstream host.docker.internal:7780;
            proxy_pass http://$media_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Worker Health (Internal debugging)
        location /worker-health/ {
            set $worker_upstream host.docker.internal:7782/;
            proxy_pass http://$worker_upstream;
            proxy_set_header Host $host;
        }
    }
}
