events {
    worker_connections 1024;
}

http {
    server {
        listen 7777;
        client_max_body_size 2m;
        client_body_timeout 30s;

        # Healthcheck
        location = /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }

        # API Health & Readiness Probes
        location = /health/live {
            proxy_pass http://host.docker.internal:7780;
            proxy_set_header Host $host;
        }
        location = /health/ready {
            proxy_pass http://host.docker.internal:7780;
            proxy_set_header Host $host;
        }

        # Web App (default)
        location / {
            proxy_pass http://host.docker.internal:7778;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support (for Vite/Next dev servers)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Admin App
        location /admin/ {
            proxy_pass http://host.docker.internal:7779;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Portal App
        location /portal/ {
            proxy_pass http://host.docker.internal:7781;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Media upload endpoint
        location = /api/admin/v1/media {
            client_max_body_size 500m;
            client_body_timeout 300s;
            proxy_read_timeout 300s;
            proxy_pass http://host.docker.internal:7780;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # Theme package upload
        location = /api/admin/v1/themes/upload {
            client_max_body_size 50m;
            client_body_timeout 120s;
            proxy_read_timeout 120s;
            proxy_pass http://host.docker.internal:7780;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # Site content imports
        location ~ ^/api/admin/v1/imports(/validate)?$ {
            client_max_body_size 50m;
            client_body_timeout 120s;
            proxy_read_timeout 120s;
            proxy_pass http://host.docker.internal:7780;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # Document content routes (allow up to 10MB for posts, pages, newsletters, translations, collection entries)
        location ~ ^/api/admin/v1/(posts|pages|newsletters|translations|content-models/[^/]+/entries)(/|$) {
            client_max_body_size 10m;
            client_body_timeout 60s;
            proxy_read_timeout 60s;
            proxy_pass http://host.docker.internal:7780;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # API
        location /api/ {
            # Preserve the /api prefix: the API registers routes under /api/...
            # (e.g. /api/admin/v1/auth/login, /api/health). Health probes can use
            # /api/health (API also exposes /health/live for direct probing).
            proxy_pass http://host.docker.internal:7780;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # Media serving (API)
        location /content/media/ {
            proxy_pass http://host.docker.internal:7780;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # Worker Health (Internal debugging)
        location /worker-health/ {
            proxy_pass http://host.docker.internal:7782/;
            proxy_set_header Host $host;
        }
    }
}
