# Production gateway — single public entry point.
# Terminates nothing (TLS is expected at the load balancer / CDN in front).
# All upstreams are compose service names on the `frontend` network.
# DB and Redis are NOT reachable from this network (see compose.prod.yml).

upstream api_upstream     { server api:7780; }
upstream web_upstream     { server web:7778; }
upstream admin_upstream   { server admin:8080; }
upstream portal_upstream  { server portal:8080; }
upstream worker_upstream  { server worker:7782; }

server {
    listen 8080;
    server_name _;
    port_in_redirect off;

    client_max_body_size 600m;

    # Security headers (CSP is set per-app: web via Next.js middleware with
    # per-request nonces, SPAs via their nginx template, API via Fastify Helmet)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Health check consumed by the gateway container healthcheck
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Root-path API health probes (also reachable via /api/health/*)
    location = /health/live {
        proxy_pass http://api_upstream;
    }
    location = /health/ready {
        proxy_pass http://api_upstream;
    }

    # API root route (exact, without trailing slash)
    location = /api {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin SPA
    location = /admin { return 301 $scheme://$http_host/admin/; }
    location /admin/ {
        proxy_pass http://admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Member portal SPA
    location = /portal { return 301 $scheme://$http_host/portal/; }
    location /portal/ {
        proxy_pass http://portal_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public site (Next.js SSR) with WebSocket upgrade support
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API (preserves the /api prefix; includes admin, member, public,
    # machine, and webhook surfaces)
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media streaming (range requests pass through; long timeouts)
    location /content/media/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Prometheus metrics (internal monitoring scrapers)
    location = /metrics {
        proxy_pass http://api_upstream;
        allow 127.0.0.0/8;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # Worker health (internal monitoring); strips the /worker-health prefix
    location /worker-health/ {
        proxy_pass http://worker_upstream/health/;
        proxy_set_header Host $host;
    }
}