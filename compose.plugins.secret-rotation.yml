# PLUG-OPS-05 additive operator-only, versioned plugin secret keyring.
# Include only AFTER all API and Worker images support v2 ciphertext:
# docker compose -f compose.prod.yml -f compose.plugins.secret-rotation.yml ...
#
# The JSON keyring contains real 256-bit secret keys; NEVER commit it to source
# or print resolved Compose config. Store it in operator-managed environment or
# a protected Compose env file with appropriate file permissions.
# Reuse the SAME active key ID and full keyring on every API/Worker replica.
# VIBRESS_ENCRYPTION_KEY stays unchanged until v1 ciphertext is fully migrated.
services:
  api:
    environment:
      VIBRESS_PLUGIN_SECRET_ACTIVE_KEY_ID: ${VIBRESS_PLUGIN_SECRET_ACTIVE_KEY_ID:?set active plugin secret key ID}
      VIBRESS_PLUGIN_SECRET_KEYS_JSON: ${VIBRESS_PLUGIN_SECRET_KEYS_JSON:?set secret keyring JSON}
  worker:
    environment:
      VIBRESS_PLUGIN_SECRET_ACTIVE_KEY_ID: ${VIBRESS_PLUGIN_SECRET_ACTIVE_KEY_ID:?set active plugin secret key ID}
      VIBRESS_PLUGIN_SECRET_KEYS_JSON: ${VIBRESS_PLUGIN_SECRET_KEYS_JSON:?set secret keyring JSON}
