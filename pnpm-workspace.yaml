packages:
  - "apps/*"
  - "packages/*"
  - "packages/domains/*"
overrides:
  nanoid: ^3.3.18
  find-my-way: ^9.10.0
  fast-uri: ^3.1.9
  ip-address: ^10.7.4
  next: ^15.5.29
  fastify: ^5.12.8
  nodemailer: ^10.1.4
  postcss: ^8.5.26
  sharp: ^0.35.5
  qs: 6.16.1
  tar: ^7.5.21
  esbuild: 0.28.1
  vite: 8.2.4
  brace-expansion: ^5.0.12
  axios: ^1.20.0
  follow-redirects: ^1.16.2
  vitest: 4.1.12
  "@vitest/coverage-v8": 4.1.12
  "@vitest/mocker": 4.1.12
  uuid: ^11.1.1
  smol-toml: ^1.8.1
  seroval: 1.6.11
  seroval-plugins: 1.6.11
  systeminformation: 5.33.16
  source-map-js: 1.2.2
  # Nx 23.3.2 pins undici 7.29.0; later 7.x patches the reported advisories.
  undici: 7.30.1
  # The gaxios -> rimraf@5 -> glob@10 chain carries two moderate advisories.
  # Scope the upgrade to rimraf's glob edge to avoid changing unrelated tooling.
  "rimraf@5>glob": 14.0.2
  # GHSA-g3hv-75wg-m249 affects minimatch >=7 <11.0.1. Dev tooling only.
  # Pin just the affected 10.x edges to the already-resolved patched 11.0.3;
  # the legacy 3.1.5 eslint-plugin edges remain untouched.
  "@nx/devkit>minimatch": 11.0.3
  "nx>minimatch": 11.0.3
  "@eslint/config-array>minimatch": 11.0.3
  "@typescript-eslint/typescript-estree>minimatch": 11.0.3
  "eslint>minimatch": 11.0.3
allowBuilds:
  argon2: true
  esbuild: true
  msgpackr-extract: true
  nx: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - markdown-it@14.3.3
