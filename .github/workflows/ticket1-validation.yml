name: Ticket 1 Supplemental Validation

on:
  push:
    branches:
      - fix/publication-content-integrity

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Verify explicit-any regression guard
        run: pnpm verify:explicit-any

      - name: Start infrastructure
        run: docker compose -f compose.dev.yml up -d --wait

      - name: Test
        run: pnpm vitest run --no-file-parallelism

      - name: Build
        run: pnpm build

      - name: Verify clean Git tree
        run: pnpm verify:clean-tree
