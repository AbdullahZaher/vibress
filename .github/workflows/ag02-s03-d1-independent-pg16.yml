name: AG02 M03-S03 D1 PostgreSQL 16 Independent Reliability Lab

on:
  push:
    branches:
      - audit/ag02-s03-d1-2517ms-pg16-reliability-20261117
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg16-d1-independent-laboratory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://vibress:vibress@127.0.0.1:5433/vibress
      NODE_ENV: test
      BASE_OPERATOR_BLOB: 31b1e862f594434944fec516f768265baf794525
      MIGRATION_0059_BLOB: 119c9b58cc79a94aac6f6ed4815c5dbced51cc02
      MIGRATION_0060_BLOB: d8b1e50a0a4dd347fde235ae7cb1a12468249719
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate exact security source boundaries and test-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object packages/database/src/platform-schema-migration-operator.ts)" = "$BASE_OPERATOR_BLOB"
          test "$(git hash-object packages/database/migrations/0060_platform_schema_authenticated_approvals.sql)" = "$MIGRATION_0060_BLOB"
          echo "INDEPENDENT_AG02_TEST_ONLY_SHA=$(git rev-parse HEAD)"
          echo "OWNER_D1_MS=2517; NOT HUMAN_DBA_APPROVAL"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.3"
      - name: Install and validate test-only changes
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @vibress/plugin-sdk build
          pnpm exec eslint tests/integration/platform-schema-migration-operator.test.ts
          pnpm typecheck
      - name: Start disposable PostgreSQL 16.16
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.dev.yml up -d --wait postgres
          v="$(docker compose -f compose.dev.yml exec -T postgres psql -At -U vibress -d vibress -c 'SHOW server_version_num')"
          test "$v" = "160016"
          echo "AG02_PG_VERSION=$v"
      - name: Repeat six exact negative D1 cases three times (real PostgreSQL)
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 3; do
            echo "AG02_D1_REPETITION=$n"
            pnpm exec vitest run --no-file-parallelism tests/integration/platform-schema-migration-operator.test.ts -t "AG02-D1"
          done
      - name: Retain original full security and fault-injection assertions
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run --no-file-parallelism tests/integration/platform-schema-migration-operator.test.ts
          pnpm exec vitest run --no-file-parallelism tests/integration/platform-schema-migration-fault-injection.test.ts
          test "$(git hash-object packages/database/src/platform-schema-migration-operator.ts)" = "$BASE_OPERATOR_BLOB"
          test "$(git hash-object packages/database/migrations/0060_platform_schema_authenticated_approvals.sql)" = "$MIGRATION_0060_BLOB"
          leaked="$(docker compose -f compose.dev.yml exec -T postgres psql -At -U vibress -d vibress -c "SELECT count(*) FROM pg_database WHERE datname LIKE 'vibress_s03_%'")"
          echo "DISPOSABLE_DB_LEAK_COUNT=$leaked"
          test "$leaked" = "0"
      - name: Destroy disposable PostgreSQL container and named volumes
        if: always()
        shell: bash
        run: docker compose -f compose.dev.yml down --volumes --remove-orphans
