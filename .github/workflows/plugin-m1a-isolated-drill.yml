name: Plugins M1A isolated replica fault drill

on:
  push:
    branches: [feat/plugin-platform-roadmap-execution-20261024]
  workflow_dispatch:

concurrency:
  group: plugin-m1a-drill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-replica-fault-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Fetch pinned historical migration baseline (immutable SHA)
        run: |
          git fetch --no-tags --depth=1 origin 3f39f29bd34625545ab8a1699415b8c98ee557c7
          test "$(git rev-parse --verify 3f39f29bd34625545ab8a1699415b8c98ee557c7^{commit})" = "3f39f29bd34625545ab8a1699415b8c98ee557c7"
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Native Admin SDK consumers resolve @vibress/plugin-sdk from dist, not src.
      # The signed-fleet child processes must exercise that packaged entrypoint.
      - name: Build plugin SDK for signed-fleet and live replica drills
        run: pnpm --filter @vibress/plugin-sdk build
      - name: Verify independent signed plugin admissions and reject stale/forged releases
        env:
          VIBRESS_M1A_DISPOSABLE_DRILL: "1"
        run: pnpm exec tsx scripts/plugins/drill-signed-fleet.ts
      - name: Check drill shell syntax
        run: |
          bash -n scripts/plugins/drill-isolated-replica-faults.sh
          bash -n scripts/plugins/drill-historical-upgrade.sh
      - name: Exercise four live processes and disposable PostgreSQL/Redis outage
        env:
          VIBRESS_M1A_DISPOSABLE_DRILL: "1"
        run: bash scripts/plugins/drill-isolated-replica-faults.sh
