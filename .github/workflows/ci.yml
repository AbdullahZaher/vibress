name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Verify explicit-any regression guard
        run: pnpm verify:explicit-any

      - name: Start infrastructure
        run: docker compose -f compose.dev.yml up -d --wait

      - name: Test
        run: pnpm vitest run --no-file-parallelism

      - name: Build
        run: pnpm build

      - name: Verify clean Git tree
        run: pnpm verify:clean-tree

  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          tags: vibress-api:scan
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          tags: vibress-worker:scan
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: vibress-api:scan
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Scan worker image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: vibress-worker:scan
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true