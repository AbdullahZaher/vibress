name: CI

on:
  push:
    branches: [main, feat/plugin-platform-completion-phases-1-4-20261021, feat/plugin-platform-roadmap-execution-20261024]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        id: production_audit
        run: pnpm audit --prod --audit-level moderate
        # Collect validation results without waiving the mandatory audit gate.
        continue-on-error: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Verify explicit-any regression guard
        run: pnpm verify:explicit-any

      - name: Start infrastructure
        run: docker compose -f compose.dev.yml up -d --wait

      - name: Checkout pinned LMS repository
        uses: actions/checkout@v7
        with:
          repository: AbdullahZaher/vibress-lms
          ref: 31773154e5a3244a55369a847e05b15e083787d0
          path: .lms-source

      - name: Validate pinned LMS and build both release fixtures
        run: |
          cd .lms-source
          npm install
          npm run verify:local

      - name: Test
        run: pnpm vitest run --no-file-parallelism

      - name: Verify locale migration 0038 replay invariants
        run: pnpm exec tsx packages/database/scripts/verify-migration-0038.ts

      - name: Build
        run: pnpm build

      - name: Verify clean Git tree
        run: pnpm verify:clean-tree

      - name: Enforce production dependency audit
        if: always()
        run: test "${{ steps.production_audit.outcome }}" = "success"

  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build
    # Image vulnerability gates must run BEFORE merging, on the exact PR head.
    # Continue to run on main pushes to validate the released runtime images.

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx (container driver for GHA cache)
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          tags: vibress-api:scan
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/worker.Dockerfile
          tags: vibress-worker:scan
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vibress-api:scan
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Scan worker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vibress-worker:scan
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
  # PR gate: gateway smoke + media streaming, image picker, and traversal checks.
  # Main release gate: full Playwright suite including fresh-install wizard.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    # An audit finding still fails build and blocks merging. Run the browser
    # smoke gate to collect independent functional evidence in that case.
    if: always() && (github.event_name == 'push' || github.event_name == 'pull_request') && (needs.build.result == 'success' || needs.build.result == 'failure')

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run E2E suite (dev stack + fresh-install wizard)
        env:
          VIBRESS_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          NEWSLETTER_UNSUBSCRIBE_SECRET: "batch10_unsub_secret_32bytes_hex!"
          STRIPE_SECRET_KEY: "sk_test_ci_e2e"
          STRIPE_WEBHOOK_SECRET: "whsec_test_secret_for_local_dev"
          EMAIL_WEBHOOK_SECRET: "batch10_email_webhook_secret_32bytes_hex"
          SMTP_HOST: "127.0.0.1"
          SMTP_PORT: "1025"
          SMTP_FROM: "vibress@localhost.local"
          SMTP_SECURE: "false"
          SITE_URL: "http://localhost:7777"
          ADMIN_ORIGIN: "http://localhost:7777"
          PORTAL_ORIGIN: "http://localhost:7777"
          CORS_ORIGINS: "http://localhost:7777"
        # Everything runs in ONE step so the background app processes stay
        # alive for the whole test run (GitHub Actions kills background
        # processes when a step ends), and the web runs in production mode
        # (`next start`) so cold-compile timeouts cannot occur on a fresh
        # runner.
        run: |
          set -e

          # --- Dev infrastructure + migrations + seed ---
          docker compose -f compose.dev.yml up -d --wait
          pnpm --filter @vibress/database run db:migrate
          pnpm --filter @vibress/database run db:seed

          # --- Production-mode web build (fast SSR, no dev cold-compile) ---
          pnpm --filter @vibress/web build

          # --- Start dev-stack apps (API/worker from source, web prod, SPAs dev) ---
          npx tsx apps/api/src/main.ts > /tmp/api.log 2>&1 &
          npx tsx apps/worker/src/main.ts > /tmp/worker.log 2>&1 &
          (cd apps/web && npx next start -p 7778 > /tmp/web.log 2>&1) &
          pnpm --filter @vibress/admin dev > /tmp/admin.log 2>&1 &
          pnpm --filter @vibress/portal dev > /tmp/portal.log 2>&1 &

          # --- Wait for API health first ---
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:7780/health/ready && break
            sleep 1
          done

          # --- Wait for dev-stack health (host ports + gateway round-trip) ---
          for i in $(seq 1 60); do
            ok=1
            for u in http://127.0.0.1:7780/health/ready http://127.0.0.1:7778 http://127.0.0.1:7779 http://127.0.0.1:7781; do
              curl -sf -o /dev/null "$u" || ok=0
            done
            [ "$ok" = "1" ] && break
            sleep 2
          done
          curl -sf http://127.0.0.1:7777/ >/dev/null || { echo 'gateway -> web round-trip failed'; tail -40 /tmp/web.log; tail -40 /tmp/api.log; exit 1; }

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # --- Fresh-install stack (setup wizard E2E, :8899) ---
            # No `--wait`: the one-shot migrate service exits (0) and
            # `up --wait` treats any exited container as a failure.
            docker compose -f compose.setup-e2e.yml up -d --build
            for i in $(seq 1 60); do
              if curl -sf -o /dev/null http://127.0.0.1:8899/nginx-health; then
                curl -sf http://127.0.0.1:8899/api/setup/v1/status && break
              fi
              sleep 5
            done
            curl -sf http://127.0.0.1:8899/api/setup/v1/status || { echo 'setup-e2e stack failed to become ready'; docker compose -f compose.setup-e2e.yml logs --tail=40; exit 1; }
          fi

          # --- Browser + tests ---
          npx playwright install chromium --with-deps
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # PR gate: gateway health, upload/traversal regressions and a real
            # authenticated collaboration WebSocket handshake via Nginx.
            # Keep the complete install/functional suite on main pushes.
            npx playwright test tests/e2e/smoke.test.ts tests/e2e/media-library-storage-integrity.test.ts --grep 'Vibress Foundation Smoke Tests|TEST (B|C|J):'
            npx playwright test tests/e2e/auth-flow.test.ts tests/e2e/collaboration-websocket-gateway.test.ts tests/e2e/settings-full-suite.test.ts tests/e2e/studio-card-selection.test.ts tests/e2e/studio-media-toolbar.test.ts tests/e2e/collaboration-truncation-regression.test.ts tests/e2e/collaboration-feature-image-isolation.test.ts
          else
            npx playwright test
          fi

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures-${{ github.run_id }}-${{ github.job }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
