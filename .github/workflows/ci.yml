name: CI

on:
  push:
    # Temporarily suspended for docs/native-admin-ui-plan-20261025 during local-only validation session.
    # RESTORATION PROCEDURE: Re-add 'docs/native-admin-ui-plan-20261025' to the push.branches list below before final release approval.
    branches: [main, feat/plugin-platform-completion-phases-1-4-20261021, feat/plugin-platform-roadmap-execution-20261024, integration/wave1-agents-01-06-20261116, integration/wave1-final-remediation-20261116, experiment/m03-s03-p06-e2a-l1-d1-final-engineering-20261118, experiment/m03-scoped-recovery-lifecycle-20261118, experiment/m03-final-engineering-closure-20261118]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.3"
          cache: "pnpm"

      - name: Install dependencies
        run: |
          git rev-parse HEAD HEAD^{tree}
          test "$(node -v)" = v24.22.3
          test "$(pnpm -v)" = 11.22.0
          pnpm install --frozen-lockfile

      - name: Audit production dependencies
        id: production_audit
        run: pnpm audit --prod --audit-level moderate
        # Collect validation results without waiving the mandatory audit gate.
        continue-on-error: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Verify explicit-any regression guard
        run: pnpm verify:explicit-any

      - name: Start infrastructure
        run: docker compose -f compose.dev.yml up -d --wait

      - name: Checkout pinned LMS repository
        uses: actions/checkout@v7
        with:
          repository: AbdullahZaher/vibress-lms
          ref: 4ae44d903b723e4411ab2a090e19e99ff87a0923
          path: .lms-source

      - name: Validate pinned LMS and build both release fixtures
        run: |
          cd .lms-source
          npm install
          npm run verify:local

      - name: Validate documentation links
        run: pnpm docs:validate-links

      - name: Test (unit, boundary, component)
        # compose.dev.yml exposes PostgreSQL and Redis on these host ports.
        # Explicit values keep isolated multi-process tests on the CI services,
        # not the local workstation defaults or the production environment.
        env:
          DATABASE_URL: "postgresql://vibress:vibress@127.0.0.1:5433/vibress"
          REDIS_URL: "redis://127.0.0.1:6380"
        run: pnpm test:unit

      - name: Test (integration)
        env:
          DATABASE_URL: "postgresql://vibress:vibress@127.0.0.1:5433/vibress"
          REDIS_URL: "redis://127.0.0.1:6380"
        run: pnpm test:integration

      - name: Verify locale migration 0038 replay invariants
        run: pnpm exec tsx packages/database/scripts/verify-migration-0038.ts

      - name: Build
        run: pnpm build

      - name: Verify clean Git tree
        run: pnpm verify:clean-tree

      - name: Enforce production dependency audit
        if: always()
        run: test "${{ steps.production_audit.outcome }}" = "success"

  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build
    # Image vulnerability gates must run BEFORE merging, on the exact PR head.
    # Continue to run on main pushes to validate the released runtime images.

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx (container driver for GHA cache)
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          tags: vibress-api:scan
          push: false
          load: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/worker.Dockerfile
          tags: vibress-worker:scan
          push: false
          load: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vibress-api:scan
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Scan worker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vibress-worker:scan
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Wave 1 Gate 5 — smoke the same scanned API and Worker images
        shell: bash
        run: |
          set -euo pipefail
          set +x
          PROJECT="w1gate5$GITHUB_RUN_ID$GITHUB_RUN_ATTEMPT"
          NETWORK="$PROJECT"_default
          API="$PROJECT-api"
          WORKER="$PROJECT-worker"
          COMPOSE_STARTED=0
          export GATE5_RESULT=FAIL GATE5_CLEANUP=NOT_RUN GATE5_API_READY=FAIL GATE5_WORKER_READY=FAIL
          export GATE5_API_SHUTDOWN=FAIL GATE5_WORKER_SHUTDOWN=FAIL GATE5_API_IMAGE_ID="" GATE5_WORKER_IMAGE_ID=""
          export GATE5_API_NODE="" GATE5_WORKER_NODE="" GATE5_PG_VERSION="" GATE5_CHECKOUT="$(git rev-parse HEAD)"
          mkdir -p artifacts
          report() {
            python3 - <<'PY'
          import json, os
          names = ["RESULT", "CLEANUP", "API_READY", "WORKER_READY", "API_SHUTDOWN", "WORKER_SHUTDOWN",
                   "API_IMAGE_ID", "WORKER_IMAGE_ID", "API_NODE", "WORKER_NODE", "PG_VERSION", "CHECKOUT"]
          data = {name.lower(): os.getenv("GATE5_" + name, "") for name in names}
          data["images"] = ["vibress-api:scan", "vibress-worker:scan"]
          data["profile"] = "isolated disposable nonproduction development configuration"
          data["entrypoint"] = "image CMD: node dist/main.js"
          data["source_binding"] = "OCI image revision verified against actual checked-out commit"
          with open("artifacts/wave1-gate5-smoke.json", "w", encoding="utf8") as f:
              json.dump(data, f, indent=2, sort_keys=True)
              f.write("\n")
          PY
          }
          cleanup() {
            rc=$?
            trap - EXIT
            clean=1
            for name in "$API" "$WORKER"; do
              if docker container inspect "$name" >/dev/null 2>&1; then
                docker rm -fv "$name" >/dev/null 2>&1 || clean=0
              fi
            done
            if [ "$COMPOSE_STARTED" = 1 ]; then
              docker compose -p "$PROJECT" -f compose.dev.yml down --volumes --remove-orphans >/dev/null 2>&1 || clean=0
            fi
            if docker network inspect "$NETWORK" >/dev/null 2>&1; then clean=0; fi
            if [ -n "$(docker volume ls -q --filter "label=com.docker.compose.project=$PROJECT")" ]; then clean=0; fi
            if [ "$clean" = 1 ]; then GATE5_CLEANUP=PASS; else GATE5_CLEANUP=FAIL; fi
            if [ "$rc" = 0 ] && [ "$GATE5_CLEANUP" = PASS ] &&
               [ "$GATE5_API_READY" = PASS ] && [ "$GATE5_WORKER_READY" = PASS ] &&
               [ "$GATE5_API_SHUTDOWN" = PASS ] && [ "$GATE5_WORKER_SHUTDOWN" = PASS ]; then
              GATE5_RESULT=PASS
            fi
            report
            unset APP_PASSWORD ENCRYPTION_KEY UNSUB_SECRET SETUP_TOKEN POSTGRES_APP_PASSWORD DATABASE_URL
            echo "GATE5_RESULT=$GATE5_RESULT CLEANUP=$GATE5_CLEANUP"
            if [ "$GATE5_RESULT" != PASS ]; then exit 1; fi
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          test "$GATE5_CHECKOUT" = "$GITHUB_SHA" || { echo "::error::Checkout SHA mismatch"; exit 1; }
          for role in API WORKER; do
            if [ "$role" = API ]; then image=vibress-api:scan; else image=vibress-worker:scan; fi
            revision="$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")"
            test "$revision" = "$GATE5_CHECKOUT" || { echo "::error::$role image revision mismatch"; exit 1; }
            id="$(docker image inspect -f '{{.Id}}' "$image")"
            version="$(docker run --rm --entrypoint node "$image" --version)"
            case "$version" in v24.*) ;; *) echo "::error::$role image is not Node 24"; exit 1 ;; esac
            if [ "$role" = API ]; then GATE5_API_IMAGE_ID="$id"; GATE5_API_NODE="$version"
            else GATE5_WORKER_IMAGE_ID="$id"; GATE5_WORKER_NODE="$version"; fi
            echo "$role image_id=$id node=$version source=$revision"
          done
          COMPOSE_STARTED=1
          docker compose -p "$PROJECT" -f compose.dev.yml up -d --wait postgres redis
          PG_CONTAINER="$(docker compose -p "$PROJECT" -f compose.dev.yml ps -q postgres)"
          GATE5_PG_VERSION="$(docker exec "$PG_CONTAINER" psql -U vibress -d vibress -Atqc 'SHOW server_version_num')"
          test "$GATE5_PG_VERSION" -ge 160016 && test "$GATE5_PG_VERSION" -lt 170000 ||
            { echo "::error::Disposable PostgreSQL is not patched PG16"; exit 1; }
          APP_PASSWORD="$(openssl rand -hex 24)"
          ENCRYPTION_KEY="$(openssl rand -hex 32)"
          UNSUB_SECRET="$(openssl rand -hex 32)"
          SETUP_TOKEN="$(openssl rand -hex 24)"
          export POSTGRES_APP_PASSWORD="$APP_PASSWORD" POSTGRES_APP_USER=vibress_app
          export DATABASE_URL=postgresql://vibress:vibress@postgres:5432/vibress
          docker run --rm --network "$NETWORK" --entrypoint node \
            -e NODE_ENV=development -e DATABASE_URL -e POSTGRES_APP_USER -e POSTGRES_APP_PASSWORD \
            vibress-api:scan dist/migrate.js
          flags="$(docker exec "$PG_CONTAINER" psql -U vibress -d vibress -Atqc \
            "SELECT NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND NOT rolbypassrls FROM pg_roles WHERE rolname='vibress_app'")"
          test "$flags" = t || { echo "::error::Missing or privileged serving DB role"; exit 1; }
          DATABASE_URL="postgresql://vibress_app:$APP_PASSWORD@postgres:5432/vibress"
          args=(-e NODE_ENV=development -e "DATABASE_URL=$DATABASE_URL" -e REDIS_URL=redis://redis:6379
            -e "VIBRESS_ENCRYPTION_KEY=$ENCRYPTION_KEY" -e "NEWSLETTER_UNSUBSCRIBE_SECRET=$UNSUB_SECRET"
            -e "VIBRESS_SETUP_TOKEN=$SETUP_TOKEN" -e SITE_URL=http://localhost:7777
            -e ADMIN_ORIGIN=http://localhost:7777 -e PORTAL_ORIGIN=http://localhost:7777
            -e CORS_ORIGINS=http://localhost:7777 -e STRIPE_SECRET_KEY=sk_test_gate5_synthetic
            -e STRIPE_WEBHOOK_SECRET=whsec_gate5_synthetic -e SMTP_HOST=127.0.0.1
            -e SMTP_PORT=1025 -e SMTP_FROM=gate5@example.invalid)
          docker run -d --network "$NETWORK" --name "$API" ${args[@]} vibress-api:scan >/dev/null
          docker run -d --network "$NETWORK" --name "$WORKER" ${args[@]} vibress-worker:scan >/dev/null
          ready() {
            docker exec "$1" node -e '
              const [port, role] = process.argv.slice(1);
              fetch("http://127.0.0.1:" + port + "/health/ready").then(async r => {
                const value = await r.json();
                const ok = role === "worker" ? "ok" : "up";
                if (r.status !== 200 || value.checks?.database !== ok ||
                    value.checks?.redis !== ok || (role === "worker" && value.checks?.pluginEvents !== "ok"))
                  process.exitCode = 1;
              }).catch(() => { process.exitCode = 1; });
            ' "$2" "$3" >/dev/null 2>&1
          }
          for role in api worker; do
            if [ "$role" = api ]; then container="$API"; port=7780; else container="$WORKER"; port=7782; fi
            healthy=0
            for attempt in $(seq 1 60); do
              if [ "$(docker inspect -f '{{.State.Running}}' "$container")" != true ]; then break; fi
              if ready "$container" "$port" "$role"; then healthy=1; break; fi
              sleep 2
            done
            test "$healthy" = 1 || { echo "::error::$role did not reach readiness within 120s"; exit 1; }
            sleep 2
            ready "$container" "$port" "$role" || { echo "::error::$role readiness was lost"; exit 1; }
            if docker logs "$container" 2>&1 | grep -Eiq 'FATAL|uncaughtException|unhandledRejection|Failed to start|Error during shutdown|permission denied|EACCES'; then
              echo "::error::$role startup reported a fatal error"; exit 1
            fi
            if [ "$role" = api ]; then GATE5_API_READY=PASS; else GATE5_WORKER_READY=PASS; fi
            echo "$role readiness=PASS database=PASS redis=PASS"
          done
          for role in API WORKER; do
            if [ "$role" = API ]; then container="$API"; else container="$WORKER"; fi
            docker stop --time 25 "$container" >/dev/null
            code="$(docker inspect -f '{{.State.ExitCode}}' "$container")"
            test "$code" = 0 || { echo "::error::$role failed graceful SIGTERM shutdown (exit=$code)"; exit 1; }
            if [ "$role" = API ]; then GATE5_API_SHUTDOWN=PASS; else GATE5_WORKER_SHUTDOWN=PASS; fi
          done
          echo "GATE5_STARTUP_SHUTDOWN_OK checkout=$GATE5_CHECKOUT"

      - name: Upload sanitized Gate 5 runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wave1-gate5-${{ github.run_id }}
          path: artifacts/wave1-gate5-smoke.json
          if-no-files-found: warn
          retention-days: 14
  # PR gate: gateway smoke + media streaming, image picker, and traversal checks.
  # Main and Studio Beta PR #141: full Playwright suite including fresh-install wizard.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    # An audit finding still fails build and blocks merging. Run the browser
    # smoke gate to collect independent functional evidence in that case.
    if: always() && (github.event_name == 'push' || github.event_name == 'pull_request') && (needs.build.result == 'success' || needs.build.result == 'failure')

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.number == 141 && github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.3"
          cache: "pnpm"

      - name: Install dependencies
        run: |
          git rev-parse HEAD HEAD^{tree}
          test "$(node -v)" = v24.22.3
          test "$(pnpm -v)" = 11.22.0
          pnpm install --frozen-lockfile

      - name: Build plugin SDK for clean-checkout E2E servers
        run: pnpm --filter @vibress/plugin-sdk build

      # The PR browser acceptance suite builds the exact signed LMS source candidate.
      # This is separate from the build job because GitHub runners do not share checkouts.
      - name: Checkout pinned LMS candidate for Native Admin UI PR acceptance
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          repository: AbdullahZaher/vibress-lms
          ref: 4ae44d903b723e4411ab2a090e19e99ff87a0923
          path: .lms-source

      - name: Run E2E suite (dev stack + fresh-install wizard)
        env:
          FULL_STUDIO_BETA_E2E: ${{ github.event.pull_request.number == 141 }}
          DATABASE_URL: "postgresql://vibress:vibress@127.0.0.1:5433/vibress"
          REDIS_URL: "redis://127.0.0.1:6380"
          VIBRESS_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          NEWSLETTER_UNSUBSCRIBE_SECRET: "batch10_unsub_secret_32bytes_hex!"
          STRIPE_SECRET_KEY: "sk_test_ci_e2e"
          STRIPE_WEBHOOK_SECRET: "whsec_test_secret_for_local_dev"
          EMAIL_WEBHOOK_SECRET: "batch10_email_webhook_secret_32bytes_hex"
          SMTP_HOST: "127.0.0.1"
          SMTP_PORT: "1025"
          SMTP_FROM: "vibress@localhost.local"
          SMTP_SECURE: "false"
          SITE_URL: "http://localhost:7777"
          ADMIN_ORIGIN: "http://localhost:7777"
          PORTAL_ORIGIN: "http://localhost:7777"
          CORS_ORIGINS: "http://localhost:7777"
        # Everything runs in ONE step so the background app processes stay
        # alive for the whole test run (GitHub Actions kills background
        # processes when a step ends), and the web runs in production mode
        # (`next start`) so cold-compile timeouts cannot occur on a fresh
        # runner.
        run: |
          set -e
          git log -1 --format='Checkout %H'
          git status --short --untracked-files=no

          # --- Dev infrastructure + migrations + seed ---
          docker compose -f compose.dev.yml up -d --wait
          pnpm --filter @vibress/database run db:migrate
          pnpm --filter @vibress/database run db:seed

          # --- Production-mode web build (fast SSR, no dev cold-compile) ---
          pnpm --filter @vibress/web build

          # --- Start dev-stack apps (API/worker from source, web prod, SPAs dev) ---
          npx tsx apps/api/src/main.ts > /tmp/api.log 2>&1 &
          npx tsx apps/worker/src/main.ts > /tmp/worker.log 2>&1 &
          (cd apps/web && npx next start -p 7778 > /tmp/web.log 2>&1) &
          pnpm --filter @vibress/admin dev > /tmp/admin.log 2>&1 &
          pnpm --filter @vibress/portal dev > /tmp/portal.log 2>&1 &

          # --- Wait for API health first ---
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:7780/health/ready && break
            sleep 1
          done

          # --- Wait for dev-stack health (host ports + gateway round-trip) ---
          for i in $(seq 1 60); do
            ok=1
            for u in http://127.0.0.1:7780/health/ready http://127.0.0.1:7778 http://127.0.0.1:7779 http://127.0.0.1:7781; do
              curl -sf -o /dev/null "$u" || ok=0
            done
            [ "$ok" = "1" ] && break
            sleep 2
          done
          curl -sf http://127.0.0.1:7777/ >/dev/null || { echo 'gateway -> web round-trip failed'; tail -40 /tmp/web.log; tail -40 /tmp/api.log; exit 1; }

          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$FULL_STUDIO_BETA_E2E" = "true" ]; then
            # --- Fresh-install stack (setup wizard E2E, :8899) ---
            # No `--wait`: the one-shot migrate service exits (0) and
            # `up --wait` treats any exited container as a failure.
            docker compose -f compose.setup-e2e.yml up -d --build
            for i in $(seq 1 60); do
              if curl -sf -o /dev/null http://127.0.0.1:8899/nginx-health; then
                curl -sf http://127.0.0.1:8899/api/setup/v1/status && break
              fi
              sleep 5
            done
            curl -sf http://127.0.0.1:8899/api/setup/v1/status || { echo 'setup-e2e stack failed to become ready'; docker compose -f compose.setup-e2e.yml logs --tail=40; exit 1; }
          fi

          # --- Browser + tests ---
          npx playwright install chromium --with-deps
          # Apps are started above in this same CI step; Playwright must not
          # run its fallback pnpm dev webServer and collide with ports.
          export PLAYWRIGHT_SKIP_WEBSERVER=1
          mkdir -p artifacts/theme-studio-ci
          if [ "$FULL_STUDIO_BETA_E2E" = "true" ]; then
            pnpm exec playwright --version
            node -e 'const { chromium } = require("@playwright/test"); (async () => { const browser = await chromium.launch(); console.log("Chromium " + browser.version()); await browser.close(); })().catch(error => { console.error(error); process.exitCode = 1; });'
            pnpm exec playwright test --list
            pnpm exec playwright test
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # PR gate: gateway health, upload/traversal regressions and a real
            # authenticated collaboration WebSocket handshake via Nginx.
            # Keep the complete install/functional suite on main pushes.
            npx playwright test tests/e2e/smoke.test.ts tests/e2e/media-library-storage-integrity.test.ts --grep 'Vibress Foundation Smoke Tests|TEST (B|C|J):'
            npx playwright test tests/e2e/auth-flow.test.ts tests/e2e/collaboration-websocket-gateway.test.ts tests/e2e/settings-full-suite.test.ts tests/e2e/studio-card-selection.test.ts tests/e2e/studio-media-toolbar.test.ts tests/e2e/collaboration-truncation-regression.test.ts tests/e2e/collaboration-feature-image-isolation.test.ts

            # Beta-freeze acceptance: execute all four previously failing host
            # browser files against these same authenticated real services.
            # Do not replace their assertions with mocks or omit from the PR gate.
            pnpm exec playwright test \
              tests/e2e/collaboration-crdt-lifecycle.test.ts \
              tests/e2e/content-modeler-flow.test.ts \
              tests/e2e/image-truncation-forensic.test.ts \
              tests/e2e/media-flow.test.ts

            # Required Native Admin UI PR acceptance: real Fastify/PostgreSQL/Redis
            # browser workflow (owns disposable services), plus fast RTL UI regressions.
            # Do not start a second shared pnpm dev stack for either suite.
            PLAYWRIGHT_SKIP_WEBSERVER=1 pnpm exec playwright test tests/e2e/native-admin-lms-real-e2e.test.ts
            PLAYWRIGHT_SKIP_WEBSERVER=1 pnpm exec playwright test tests/e2e/native-admin-lms-arabic-rtl.test.ts
          else
            npx playwright test
          fi

          # Capture reproducible Theme Studio visual evidence matrix (60 screenshots across viewports, locales, themes, editor, upload dialog)
          THEME_STUDIO_BASE_URL="http://127.0.0.1:7777" THEME_STUDIO_ADMIN_EMAIL="owner@example.com" THEME_STUDIO_ADMIN_PASSWORD="OwnerPass123!" THEME_STUDIO_OUTPUT="artifacts/theme-studio-ci" pnpm exec tsx scripts/capture-theme-studio-qa.ts

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures-${{ github.run_id }}-${{ github.job }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      # Store screenshots independently; later Playwright suites clean test-results.
      - name: Upload admin design-review screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-ui-design-review-${{ github.run_id }}
          path: |
            artifacts/theme-studio-ci/**
            artifacts/theme-studio/**
            test-results/**/design-*.png
          if-no-files-found: ignore
          retention-days: 7


  # Mandatory Wave 1 reference CRM browser acceptance, independent from
  # the legacy CMS browser smoke suite. Uses a disposable PostgreSQL fixture.
  platform-reference-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.3"
          cache: "pnpm"

      - name: Install dependencies
        run: |
          git rev-parse HEAD HEAD^{tree}
          test "$(node -v)" = v24.22.3
          test "$(pnpm -v)" = 11.22.0
          pnpm install --frozen-lockfile

      - name: Start disposable PostgreSQL
        run: docker compose -f compose.dev.yml up -d --wait postgres

      - name: Verify patched PostgreSQL 16 fixture
        run: |
          version=$(docker compose -f compose.dev.yml exec -T postgres psql -U vibress -d vibress -Atqc "SHOW server_version_num")
          echo "PostgreSQL server_version_num=$version"
          test "$version" -ge 160016 && test "$version" -lt 170000

      - name: Apply additive migrations on fresh install
        env:
          DATABASE_URL: "postgresql://vibress:vibress@127.0.0.1:5433/vibress"
        run: pnpm db:migrate

      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Reference CRM HTTP + RLS + browser E2E
        env:
          DATABASE_URL: "postgresql://vibress:vibress@127.0.0.1:5433/vibress"
        run: pnpm test:e2e:platform-reference

