name: Generate patched dependency lockfile

on:
  push:
    paths:
      - pnpm-workspace.yaml
      - .github/workflows/generate-patched-lockfile.yml

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - name: Regenerate lockfile for security override
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Verify production dependency audit
        run: pnpm audit --prod --audit-level moderate
      - name: Upload reproducible lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patched-pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
