name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  verify-and-release:
    name: Verify, Package & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Types
        run: pnpm typecheck

      - name: Verify Linting
        run: pnpm -r lint

      - name: Start infrastructure
        run: docker compose -f compose.dev.yml up -d --wait

      - name: Run Test Suite
        run: pnpm vitest run --no-file-parallelism

      - name: Verify Production Build
        run: pnpm build

      - name: Verify Clean Git Tree
        run: pnpm verify:clean-tree

      - name: Package Theme Starter Distribution
        run: node scripts/pack-starter-theme.js || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: "Vibress ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          generate_release_notes: true
          files: |
            content/vibress-theme-starter.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
