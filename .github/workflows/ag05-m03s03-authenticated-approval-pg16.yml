name: AG05 M03-S03 authenticated approval provenance PG16 negative gate

on:
  push:
    branches:
      - fix/m03-s03-iam-provenance-revocation-20261117
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-pg16:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated candidate
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.3"
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Print exact SHA and verify typecheck
        run: |
          git rev-parse HEAD
          node --version
          pnpm typecheck
      - name: ESLint and explicit-any security regression
        run: |
          pnpm exec eslint packages/database/src/platform-schema-migration-operator.ts packages/database/src/schema/platform-schema-execution.ts tests/integration/platform-schema-migration-operator.test.ts
          pnpm verify:explicit-any
      - name: Start disposable PostgreSQL 16
        run: docker compose -f compose.dev.yml up -d --wait
      - name: Verify actual PostgreSQL 16 security patch level
        run: |
          version=$(docker compose -f compose.dev.yml exec -T postgres psql -At -U vibress -d vibress -c "SHOW server_version_num")
          echo "PostgreSQL server_version_num=$version"
          test "$version" -ge 160016 && test "$version" -lt 170000
      - name: Execute real PostgreSQL authenticated role and revocation negatives
        env:
          DATABASE_URL: postgresql://vibress:vibress@127.0.0.1:5433/vibress
          REDIS_URL: redis://127.0.0.1:6380
        run: pnpm exec vitest run --no-file-parallelism tests/integration/platform-schema-migration-operator.test.ts
      - name: Validate schema engine regression
        run: pnpm --filter @vibress/schema-engine test
      - name: Tear down disposable services
        if: always()
        run: docker compose -f compose.dev.yml down --volumes
