name: Plugins Tier 2 Kernel Isolation Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/plugins-tier2-kernel-acceptance.yml"
      - "scripts/verify-tier2-bubblewrap-isolation.mjs"
      - "packages/domains/plugins/src/runtime/tier2-process-supervisor.ts"
      - "packages/domains/plugins/src/runtime/tier2-sandbox-worker.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugins-tier2-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bubblewrap-kernel-probe:
    name: Linux Bubblewrap kernel namespace smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap python3

      - name: Prove real kernel containment (fail-closed)
        run: node scripts/verify-tier2-bubblewrap-isolation.mjs

      - name: Explain remaining M8 activation blockers
        run: |
          echo "This test validates standalone Linux mount, PID and network namespaces only."
          echo "It does NOT authorize Tier 2 untrusted execution: authenticated sandbox IPC,"
          echo "per-plugin resource quotas and immutable release binding must be separately"
          echo "implemented, penetration-tested and explicitly approved."
