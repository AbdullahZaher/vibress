# W1-T06 disposable resource-isolation laboratory. NEVER target shared services.
# Two independently authenticated installations share physical test servers, but
# permissions are enforced by Redis ACLs and S3 IAM (not by names alone).
services:
  redis:
    image: redis:7.4.11-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - target: 6379
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    read_only: true
    tmpfs:
      - /data
    security_opt:
      - no-new-privileges:true
  minio:
    # Matches the exact disposable image used by compose.dev.yml at reviewed HEAD.
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${T06_ROOT_USER:?disposable root identity required}
      MINIO_ROOT_PASSWORD: ${T06_ROOT_PASSWORD:?disposable root password required}
    ports:
      - target: 9000
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /data
