# Dedicated fresh-install environment for the First-Run Setup Wizard E2E.
#
#   docker compose -f compose.setup-e2e.yml up -d --build
#   npx playwright test tests/e2e/setup-wizard.test.ts
#
# Runs on host port 8899 with its own fresh volumes, so it never touches the
# dev stack (7777) or the production stack. VIBRESS_SETUP_TOKEN must be set —
# the wizard spec uses the value from tests/e2e/fixtures/setup-env.ts.

name: vibress-setup-e2e

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibress
      POSTGRES_PASSWORD: vibress
      POSTGRES_DB: vibress
    volumes:
      - setup_e2e_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibress -d vibress"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - setup_e2e_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment: &app-environment
      NODE_ENV: production
      DATABASE_URL: postgresql://vibress:vibress@postgres:5432/vibress
      REDIS_URL: redis://redis:6379
      SITE_URL: http://localhost:8899
      ADMIN_ORIGIN: http://localhost:8899
      PORTAL_ORIGIN: http://localhost:8899
      CORS_ORIGINS: http://localhost:8899
      VIBRESS_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NEWSLETTER_UNSUBSCRIBE_SECRET: setup-e2e-unsub-secret
      STRIPE_SECRET_KEY: sk_test_setup_e2e
      STRIPE_WEBHOOK_SECRET: whsec_setup_e2e
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      SMTP_FROM: Vibress <no-reply@vibress.local>
      VIBRESS_SETUP_TOKEN: setup-e2e-token-0123456789abcdef0123456789abcdef
    command: ["sh", "-c", "cd /repo && pnpm --filter @vibress/database run db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7780/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  admin:
    build:
      context: .
      dockerfile: docker/spa.Dockerfile
      args:
        APP: admin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/admin/"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "7778"
      HOSTNAME: 0.0.0.0
      API_URL: "http://api:7780"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7778/"]
      interval: 10s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: docker/setup-e2e-gateway.Dockerfile
    restart: unless-stopped
    ports:
      - "8899:8080"
    depends_on:
      - api
      - admin
      - web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  setup_e2e_postgres:
  setup_e2e_redis:
